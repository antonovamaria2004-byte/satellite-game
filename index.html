<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Спутниковая группировка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header id="top-bar">
            <h1>Спутниковая группировка</h1>
            <div id="mission-info">Миссия 1 / 5 — Запустить 2 спутника</div>
        </header>

        <main id="game-area">
            <canvas id="canvas"></canvas>
            
            <!-- Всплывающее сообщение о событии -->
            <div id="event-banner" class="hidden">
                <span id="event-text">Событие</span>
            </div>
        </main>

        <section id="controls">
            <div class="control-group">
                <label for="altitude">Базовая высота: <span id="altitude-value">300</span> км</label>
                <input type="range" id="altitude" min="200" max="800" value="300" step="10">
            </div>

            <div class="control-group">
                <label for="impulse">Импульс: <span id="impulse-value">50</span>%</label>
                <input type="range" id="impulse" min="10" max="100" value="50" step="1">
            </div>

            <div class="control-group">
                <label for="count">Количество спутников: <span id="count-value">2</span></label>
                <input type="range" id="count" min="1" max="8" value="2" step="1">
            </div>

            <div class="control-group">
                <label for="interval">Интервал запуска: <span id="interval-value">5</span> с</label>
                <input type="range" id="interval" min="1" max="15" value="5" step="1">
            </div>

            <div class="button-row">
                <button id="start-btn">Запуск</button>
                <button id="pause-btn" disabled>Пауза</button>
                <button id="correct-btn" disabled>Коррекция</button>
            </div>
            <div class="button-row" style="margin-top: 8px;">
                <button id="reset-btn">Заново</button>
                <button id="achievements-btn" style="background:#553300; border-color:#ffaa00;">Достижения</button>
            </div>
            <div class="button-row" style="margin-top: 8px;">
                <button id="reset-campaign-btn" style="background: #550000; border-color: #ff4444;">Сбросить кампанию</button>
            </div>
        </section>

        <section id="telemetry">
            <div>Время: <span id="time-value">0.0</span> с</div>
            <div>Запущено: <span id="launched-value">0 / 2</span></div>
            <div>Столкновений: <span id="collision-value">0</span></div>
            <div>ΔV: <span id="dv-value">0</span></div>
            <div id="selected-info" class="hidden">Выбран: <span id="selected-value">—</span></div>
        </section>

        <!-- Панель достижений -->
        <div id="achievements-screen" class="hidden">
            <h2>Достижения</h2>
            <ul id="achievements-list"></ul>
            <button id="close-achievements-btn">Закрыть</button>
        </div>

        <div id="result-screen" class="hidden">
            <h2 id="result-title">Результат</h2>
            <p id="result-text"></p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="result-next-btn" class="hidden">Следующая миссия</button>
                <button id="result-reset-btn">Заново</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
