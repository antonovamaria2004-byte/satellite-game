<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Спутниковая группировка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header id="top-bar">
            <h1>Спутниковая группировка</h1>
        </header>

        <main id="game-area">
            <canvas id="canvas"></canvas>
        </main>

        <section id="controls">
            <div class="control-group">
                <label for="altitude">Высота орбиты: <span id="altitude-value">400</span> км</label>
                <input type="range" id="altitude" min="200" max="800" value="400" step="10">
            </div>

            <div class="control-group">
                <label for="impulse">Импульс: <span id="impulse-value">50</span>%</label>
                <input type="range" id="impulse" min="10" max="100" value="50" step="1">
            </div>

            <div class="control-group">
                <label for="count">Количество спутников: <span id="count-value">3</span></label>
                <input type="range" id="count" min="1" max="8" value="3" step="1">
            </div>

            <div class="control-group">
                <label for="interval">Интервал запуска: <span id="interval-value">4</span> с</label>
                <input type="range" id="interval" min="1" max="15" value="4" step="1">
            </div>

            <div class="button-row">
                <button id="start-btn">Запуск</button>
                <button id="reset-btn">Заново</button>
            </div>
        </section>

        <section id="telemetry">
            <div>Время: <span id="time-value">0.0</span> с</div>
            <div>Запущено: <span id="launched-value">0 / 3</span></div>
            <div>Столкновений: <span id="collision-value">0</span></div>
        </section>

        <div id="result-screen" class="hidden">
            <h2 id="result-title">Результат</h2>
            <p id="result-text"></p>
            <button id="result-reset-btn">Заново</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
