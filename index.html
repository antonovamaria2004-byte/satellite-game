<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Спутниковая группировка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header id="top-bar">
            <div class="top-row">
                <h1>Спутниковая группировка</h1>
                <button id="menu-btn" class="icon-btn">☰</button>
            </div>
            <div id="mission-info">Миссия 1 / 5 — Запустить 2 спутника</div>
        </header>

        <!-- Выезжающее меню -->
        <div id="side-menu" class="hidden">
            <button id="achievements-btn">🏆 Достижения</button>
            <button id="reset-campaign-btn" class="danger">🔄 Сбросить кампанию</button>
            <button id="fullscreen-btn">⛶ На весь экран</button>
            <button id="close-menu-btn">✖ Закрыть</button>
        </div>

        <main id="game-area">
            <canvas id="canvas"></canvas>
            <div id="event-banner" class="hidden">
                <span id="event-text">Событие</span>
            </div>
        </main>

        <section id="controls">
            <div class="queue-label">Очередь запуска (нажмите, чтобы настроить):</div>
            <div id="satellite-queue" class="queue-container"></div>

            <!-- Панель настройки выбранного в очереди спутника -->
            <div id="setup-panel" class="hidden">
                <div class="setup-title">Настройка SAT-<span id="setup-id">1</span></div>
                <div class="control-group">
                    <label for="setup-altitude">Высота: <span id="setup-altitude-value">400</span> км</label>
                    <input type="range" id="setup-altitude" min="200" max="800" value="400" step="10">
                </div>
            </div>

            <div class="sliders-grid">
                <div class="control-group">
                    <label for="impulse">Импульс: <span id="impulse-value">50</span>%</label>
                    <input type="range" id="impulse" min="10" max="100" value="50" step="1">
                </div>

                <div class="control-group">
                    <label for="count">Кол-во: <span id="count-value">3</span></label>
                    <input type="range" id="count" min="1" max="8" value="3" step="1">
                </div>

                <div class="control-group">
                    <label for="interval">Интервал: <span id="interval-value">4</span> с</label>
                    <input type="range" id="interval" min="1" max="15" value="4" step="1">
                </div>
            </div>

            <div class="button-row main-actions">
                <button id="start-btn" class="primary">ЗАПУСК</button>
                <button id="pause-btn" disabled>ПАУЗА</button>
                <button id="correct-btn" disabled style="background:#333; border-color:#555;">КОРРЕКЦИЯ</button>
                <button id="reset-btn">ЗАНОВО</button>
            </div>
        </section>

        <div id="hint-bar">Нажмите «Запуск», чтобы начать миссию</div>

        <section id="telemetry">
            <div>Время: <span id="time-value">0.0</span> с</div>
            <div>Запущено: <span id="launched-value">0 / 3</span></div>
            <div>Столкновений: <span id="collision-value">0</span></div>
            <div>ΔV: <span id="dv-value">0</span></div>
            <div id="selected-info" class="hidden">Выбран: <span id="selected-value">—</span></div>
        </section>

        <!-- Панель достижений -->
        <div id="achievements-screen" class="hidden">
            <h2>Достижения</h2>
            <ul id="achievements-list"></ul>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                <button id="close-achievements-btn">Закрыть</button>
                <button id="reset-all-btn" style="background: #550000; border-color: #ff4444;">Сбросить всё</button>
            </div>
        </div>

        <!-- Экран результата -->
        <div id="result-screen" class="hidden">
            <h2 id="result-title">Результат</h2>
            <p id="result-text"></p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="result-next-btn" class="primary hidden">Следующая</button>
                <button id="result-reset-btn">Заново</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
